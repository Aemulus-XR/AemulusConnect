name: Release Workflow

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ github.token }}
          config-file: .github/release-please/release-please-config.json
          manifest-file: .github/release-please/.release-please-manifest.json

  build-and-upload:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX Toolset
        run: dotnet tool install --global wix

      - name: Build application and installer
        run: |
          powershell -ExecutionPolicy Bypass -File ".\tools\build-and-package.ps1"

      - name: Find and upload MSI to release
        run: |
          # Find the versioned MSI file (e.g., AemulusConnect-Installer-2.6.2.msi)
          $msiFile = Get-ChildItem -Path ./src/Shipping/installer/ -Filter "AemulusConnect-Installer-*.msi" | Select-Object -First 1

          if ($msiFile) {
            Write-Host "Found MSI: $($msiFile.Name)"

            # Rename to include git tag instead of just version
            $newName = "AemulusConnect-${{ needs.release-please.outputs.tag_name }}.msi"
            $newPath = Join-Path $msiFile.Directory.FullName $newName

            Copy-Item -Path $msiFile.FullName -Destination $newPath
            Write-Host "Copied to: $newName"

            # Upload to release
            gh release upload ${{ needs.release-please.outputs.tag_name }} $newPath --clobber
            Write-Host "Uploaded to release ${{ needs.release-please.outputs.tag_name }}"
          } else {
            Write-Host "ERROR: No MSI file found matching pattern AemulusConnect-Installer-*.msi"
            Write-Host "Available files in installer directory:"
            Get-ChildItem -Path ./src/Shipping/installer/ -Recurse | Format-Table Name, Length
            exit 1
          }
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Send Discord notification
        run: |
          $releaseUrl = "https://github.com/${{ github.repository }}/releases/tag/${{ needs.release-please.outputs.tag_name }}"
          .\tools\message_discord.ps1 -Version "${{ needs.release-please.outputs.tag_name }}" -ReleaseUrl $releaseUrl
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
